<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">MedAI claim-provenance graph with a highlighted replication path</title>
  <desc id="desc">A dark interface showing one highlighted path from dataset through preprocessing, training, model, validation, and claim nodes. A side panel compares closely matching paper and reproduced results and marks the claim close.</desc>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#2d5b86" opacity="0.72"/>
    </pattern>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#091a2f"/>
    </linearGradient>
    <linearGradient id="activeNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17314f"/>
      <stop offset="1" stop-color="#10243c"/>
    </linearGradient>
    <linearGradient id="closePill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123f38"/>
      <stop offset="1" stop-color="#0d312d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66dcff"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { fill: #9db2ce; font-size: 11px; font-weight: 700; letter-spacing: 1.45px; }
      .heading { fill: #ecf5ff; font-size: 16px; font-weight: 700; }
      .subtle { fill: #8299b6; font-size: 12px; }
      .dim-edge { fill: none; stroke: #476783; stroke-width: 1.5; opacity: 0.38; }
      .active-edge-shadow { fill: none; stroke: #2bb8e7; stroke-width: 11; stroke-linecap: round; opacity: 0.24; }
      .active-edge { fill: none; stroke: #7fe5ff; stroke-width: 3.4; stroke-linecap: round; marker-end: url(#arrow); }
      .dim-node { fill: #0c1d31; stroke: #2b4662; stroke-width: 1; opacity: 0.55; }
      .active-node { fill: url(#activeNode); stroke: #7fe5ff; stroke-width: 1.7; }
      .node-label { fill: #eff8ff; font-size: 10px; font-weight: 650; }
      .node-meta { fill: #9bb0c9; font-size: 8.5px; }
      .dim-label { fill: #7890ab; font-size: 9px; font-weight: 600; opacity: 0.68; }
      .card { fill: #0c1a2e; stroke: #294663; stroke-width: 1; }
      .metric { fill: #d7e5f7; font-size: 11.5px; }
      .metric-muted { fill: #8da3bf; font-size: 10px; }
      .divider { stroke: #28425d; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="720" fill="#081426"/>
  <rect width="1060" height="720" fill="url(#canvas)"/>
  <rect y="72" width="1060" height="648" fill="url(#grid)"/>
  <rect x="1060" width="540" height="720" fill="#0b182b"/>
  <line x1="1059.5" y1="0" x2="1059.5" y2="720" stroke="#31506e"/>

  <!-- Graph toolbar -->
  <g class="sans">
    <rect x="24" y="16" width="318" height="40" rx="9" fill="#08182a" stroke="#31506e"/>
    <circle cx="43" cy="36" r="6" fill="none" stroke="#7891ae" stroke-width="1.3"/>
    <path d="M47.5 40.5L53 46" stroke="#7891ae" stroke-width="1.3" stroke-linecap="round"/>
    <text x="65" y="41" fill="#7389a4" font-size="12">Search node, claim, or issue…</text>

    <rect x="356" y="16" width="40" height="40" rx="9" fill="#11243b" stroke="#31506e"/>
    <text x="376" y="42" fill="#d8e7f8" font-size="19" text-anchor="middle">−</text>
    <rect x="406" y="16" width="40" height="40" rx="9" fill="#11243b" stroke="#31506e"/>
    <text x="426" y="42" fill="#d8e7f8" font-size="19" text-anchor="middle">+</text>
    <rect x="456" y="16" width="48" height="40" rx="9" fill="#11243b" stroke="#31506e"/>
    <text x="480" y="41" fill="#d8e7f8" font-size="12" font-weight="700" text-anchor="middle">Fit</text>

    <circle cx="648" cy="36" r="4" fill="#4fe0a0"/>
    <text x="660" y="41" fill="#9db2ce" font-size="11.5">Highlighted lineage</text>
    <text x="1018" y="41" fill="#8299b6" font-size="11.5" text-anchor="end">Hover: lineage · Drag: pan · Wheel: zoom</text>
  </g>
  <line x1="0" y1="72" x2="1060" y2="72" stroke="#2a4867"/>

  <!-- Graph title and legend -->
  <g class="sans">
    <text x="34" y="108" class="eyebrow">EXECUTABLE CLAIM-PROVENANCE GRAPH</text>
    <text x="34" y="130" class="subtle">Selected path: primary held-out performance claim</text>
    <rect x="804" y="97" width="10" height="10" rx="3" fill="#66dcff"/>
    <text x="821" y="107" class="subtle">selected path</text>
    <rect x="912" y="97" width="10" height="10" rx="3" fill="#263e59"/>
    <text x="929" y="107" class="subtle">other paths</text>
  </g>

  <!-- Column labels -->
  <g class="sans eyebrow" text-anchor="middle">
    <text x="95" y="168">DATA</text>
    <text x="235" y="168">PREPROCESS</text>
    <text x="375" y="168">PREPROCESS</text>
    <text x="515" y="168">TRAIN</text>
    <text x="655" y="168">MODEL</text>
    <text x="795" y="168">VALIDATE</text>
    <text x="935" y="168">CLAIM</text>
  </g>

  <!-- Non-selected graph edges -->
  <g>
    <path class="dim-edge" d="M150 212 C170 212 170 212 190 212"/>
    <path class="dim-edge" d="M150 462 C170 462 170 462 190 462"/>
    <path class="dim-edge" d="M290 212 C310 212 310 212 330 212"/>
    <path class="dim-edge" d="M290 212 C310 212 310 462 330 462"/>
    <path class="dim-edge" d="M290 337 C310 337 310 212 330 212"/>
    <path class="dim-edge" d="M290 337 C310 337 310 462 330 462"/>
    <path class="dim-edge" d="M430 212 C450 212 450 212 470 212"/>
    <path class="dim-edge" d="M430 462 C450 462 450 462 470 462"/>
    <path class="dim-edge" d="M570 212 C590 212 590 212 610 212"/>
    <path class="dim-edge" d="M570 462 C590 462 590 462 610 462"/>
    <path class="dim-edge" d="M710 212 C730 212 730 212 750 212"/>
    <path class="dim-edge" d="M710 462 C730 462 730 462 750 462"/>
    <path class="dim-edge" d="M850 212 C870 212 870 212 890 212"/>
    <path class="dim-edge" d="M850 462 C870 462 870 462 890 462"/>
    <path class="dim-edge" d="M430 212 C590 120 700 120 750 212"/>
    <path class="dim-edge" d="M430 462 C590 554 700 554 750 462"/>
  </g>

  <!-- Highlighted path -->
  <g filter="url(#glow)">
    <path class="active-edge-shadow" d="M150 337H190 M290 337H330 M430 337H470 M570 337H610 M710 337H750 M850 337H890"/>
    <path class="active-edge" d="M150 337H190"/>
    <path class="active-edge" d="M290 337H330"/>
    <path class="active-edge" d="M430 337H470"/>
    <path class="active-edge" d="M570 337H610"/>
    <path class="active-edge" d="M710 337H750"/>
    <path class="active-edge" d="M850 337H890"/>
  </g>

  <!-- Dimmed nodes -->
  <g class="sans">
    <g><rect x="40" y="190" width="110" height="44" rx="8" class="dim-node"/><text x="52" y="209" class="dim-label">D1 · Derivation</text><text x="52" y="224" class="node-meta" opacity="0.5">MIMIC-IV</text></g>
    <g><rect x="40" y="440" width="110" height="44" rx="8" class="dim-node"/><text x="52" y="459" class="dim-label">D3 · External</text><text x="52" y="474" class="node-meta" opacity="0.5">eICU cohort</text></g>
    <g><rect x="190" y="190" width="100" height="44" rx="8" class="dim-node"/><text x="202" y="209" class="dim-label">P3 · Cohort A</text><text x="202" y="224" class="node-meta" opacity="0.5">paper split</text></g>
    <g><rect x="190" y="440" width="100" height="44" rx="8" class="dim-node"/><text x="202" y="459" class="dim-label">P4 · External</text><text x="202" y="474" class="node-meta" opacity="0.5">site mapping</text></g>
    <g><rect x="330" y="190" width="100" height="44" rx="8" class="dim-node"/><text x="342" y="209" class="dim-label">P5 · Ablation</text><text x="342" y="224" class="node-meta" opacity="0.5">12 features</text></g>
    <g><rect x="330" y="440" width="100" height="44" rx="8" class="dim-node"/><text x="342" y="459" class="dim-label">P6 · Transfer</text><text x="342" y="474" class="node-meta" opacity="0.5">harmonized</text></g>
    <g><rect x="470" y="190" width="100" height="44" rx="8" class="dim-node"/><text x="482" y="209" class="dim-label">T2 · Baseline</text><text x="482" y="224" class="node-meta" opacity="0.5">logistic</text></g>
    <g><rect x="470" y="440" width="100" height="44" rx="8" class="dim-node"/><text x="482" y="459" class="dim-label">T3 · Transfer</text><text x="482" y="474" class="node-meta" opacity="0.5">seed 42</text></g>
    <g><rect x="610" y="190" width="100" height="44" rx="8" class="dim-node"/><text x="622" y="209" class="dim-label">M2 · Baseline</text><text x="622" y="224" class="node-meta" opacity="0.5">model.pkl</text></g>
    <g><rect x="610" y="440" width="100" height="44" rx="8" class="dim-node"/><text x="622" y="459" class="dim-label">M3 · Transfer</text><text x="622" y="474" class="node-meta" opacity="0.5">model.pkl</text></g>
    <g><rect x="750" y="190" width="100" height="44" rx="8" class="dim-node"/><text x="762" y="209" class="dim-label">V2 · Ablation</text><text x="762" y="224" class="node-meta" opacity="0.5">held-out</text></g>
    <g><rect x="750" y="440" width="100" height="44" rx="8" class="dim-node"/><text x="762" y="459" class="dim-label">V3 · External</text><text x="762" y="474" class="node-meta" opacity="0.5">eICU</text></g>
    <g><rect x="890" y="190" width="90" height="44" rx="8" class="dim-node"/><text x="902" y="209" class="dim-label">C2 · Ablation</text><text x="902" y="224" class="node-meta" opacity="0.5">Table 3</text></g>
    <g><rect x="890" y="440" width="90" height="44" rx="8" class="dim-node"/><text x="902" y="459" class="dim-label">C3 · External</text><text x="902" y="474" class="node-meta" opacity="0.5">Figure 4</text></g>
  </g>

  <!-- Selected nodes -->
  <g class="sans">
    <g>
      <rect x="40" y="312" width="110" height="50" rx="9" class="active-node"/>
      <rect x="40" y="312" width="24" height="50" rx="9" fill="#167ca1"/><path d="M64 312V362" stroke="#7fe5ff" opacity="0.45"/>
      <text x="52" y="342" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">D2</text>
      <text x="72" y="333" class="node-label">Test cohort</text><text x="72" y="349" class="node-meta">MIMIC-IV</text>
    </g>
    <g>
      <rect x="190" y="312" width="100" height="50" rx="9" class="active-node"/>
      <rect x="190" y="312" width="24" height="50" rx="9" fill="#7049c8"/><path d="M214 312V362" stroke="#bda7ff" opacity="0.45"/>
      <text x="202" y="342" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">P1</text>
      <text x="222" y="333" class="node-label">Eligibility</text><text x="222" y="349" class="node-meta">&amp; split</text>
    </g>
    <g>
      <rect x="330" y="312" width="100" height="50" rx="9" class="active-node"/>
      <rect x="330" y="312" width="24" height="50" rx="9" fill="#7049c8"/><path d="M354 312V362" stroke="#bda7ff" opacity="0.45"/>
      <text x="342" y="342" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">P2</text>
      <text x="362" y="333" class="node-label">20 features</text><text x="362" y="349" class="node-meta">impute + scale</text>
    </g>
    <g>
      <rect x="470" y="312" width="100" height="50" rx="9" class="active-node"/>
      <rect x="470" y="312" width="24" height="50" rx="9" fill="#bd3f9f"/><path d="M494 312V362" stroke="#ff9fe4" opacity="0.45"/>
      <text x="482" y="342" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">T1</text>
      <text x="502" y="333" class="node-label">XGBoost</text><text x="502" y="349" class="node-meta">seed 42</text>
    </g>
    <g>
      <rect x="610" y="312" width="100" height="50" rx="9" class="active-node"/>
      <rect x="610" y="312" width="24" height="50" rx="9" fill="#d26a3d"/><path d="M634 312V362" stroke="#ffc1a4" opacity="0.45"/>
      <text x="622" y="342" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">M1</text>
      <text x="642" y="333" class="node-label">Fitted model</text><text x="642" y="349" class="node-meta">model.json</text>
    </g>
    <g>
      <rect x="750" y="312" width="100" height="50" rx="9" class="active-node"/>
      <rect x="750" y="312" width="24" height="50" rx="9" fill="#c69221"/><path d="M774 312V362" stroke="#ffe09b" opacity="0.45"/>
      <text x="762" y="342" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">V1</text>
      <text x="782" y="333" class="node-label">Held-out</text><text x="782" y="349" class="node-meta">5 metrics</text>
    </g>
    <g>
      <rect x="890" y="312" width="90" height="50" rx="9" class="active-node"/>
      <rect x="890" y="312" width="24" height="50" rx="9" fill="#248b67"/><path d="M914 312V362" stroke="#8cf4ca" opacity="0.45"/>
      <text x="902" y="342" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">C1</text>
      <text x="922" y="333" class="node-label">Primary</text><text x="922" y="349" class="node-meta">Table 2</text>
    </g>
  </g>

  <!-- Selected lineage footer -->
  <g class="sans">
    <rect x="34" y="610" width="980" height="72" rx="12" fill="#0b1c31" stroke="#294763"/>
    <text x="54" y="636" class="eyebrow">SELECTED LINEAGE</text>
    <text x="54" y="662" fill="#dbeafb" font-size="12.5">D2</text><text x="84" y="662" fill="#4f7799">→</text>
    <text x="108" y="662" fill="#dbeafb" font-size="12.5">P1</text><text x="138" y="662" fill="#4f7799">→</text>
    <text x="162" y="662" fill="#dbeafb" font-size="12.5">P2</text><text x="192" y="662" fill="#4f7799">→</text>
    <text x="216" y="662" fill="#dbeafb" font-size="12.5">T1</text><text x="246" y="662" fill="#4f7799">→</text>
    <text x="270" y="662" fill="#dbeafb" font-size="12.5">M1</text><text x="304" y="662" fill="#4f7799">→</text>
    <text x="328" y="662" fill="#dbeafb" font-size="12.5">V1</text><text x="358" y="662" fill="#4f7799">→</text>
    <text x="382" y="662" fill="#7fe5ff" font-size="12.5" font-weight="700">C1</text>
    <rect x="775" y="630" width="108" height="30" rx="15" fill="#102f31" stroke="#286b5c"/>
    <circle cx="794" cy="645" r="5" fill="#4fe0a0"/>
    <text x="806" y="649" fill="#a8f5d5" font-size="11.5" font-weight="700">7/7 VERIFIED</text>
    <rect x="894" y="630" width="100" height="30" rx="15" fill="#102f31" stroke="#286b5c"/>
    <text x="944" y="649" fill="#a8f5d5" font-size="11.5" font-weight="700" text-anchor="middle">0 RISKS</text>
  </g>

  <!-- Claim comparison panel -->
  <g class="sans">
    <text x="1092" y="40" class="eyebrow">SELECTED CLAIM</text>
    <text x="1092" y="64" class="heading">C1 · Primary held-out performance</text>
    <line x1="1092" y1="84" x2="1568" y2="84" class="divider"/>
    <text x="1092" y="112" class="eyebrow">CLAIM COMPARISON</text>

    <rect x="1092" y="130" width="226" height="262" rx="11" class="card"/>
    <rect x="1332" y="130" width="236" height="262" rx="11" class="card"/>
    <text x="1108" y="154" class="eyebrow">PAPER RESULT</text>
    <text x="1348" y="154" class="eyebrow">REPRODUCED RESULT</text>
    <line x1="1108" y1="166" x2="1302" y2="166" class="divider"/>
    <line x1="1348" y1="166" x2="1552" y2="166" class="divider"/>

    <g class="mono metric">
      <text x="1108" y="194">AUC</text><text x="1298" y="194" text-anchor="end">0.8207</text>
      <text x="1108" y="228">Accuracy</text><text x="1298" y="228" text-anchor="end">0.7315</text>
      <text x="1108" y="262">Sensitivity</text><text x="1298" y="262" text-anchor="end">0.7682</text>
      <text x="1108" y="296">Specificity</text><text x="1298" y="296" text-anchor="end">0.7222</text>
      <text x="1108" y="330">F1</text><text x="1298" y="330" text-anchor="end">0.5370</text>

      <text x="1348" y="194">AUC</text><text x="1548" y="194" text-anchor="end">0.8198</text>
      <text x="1348" y="228">Accuracy</text><text x="1548" y="228" text-anchor="end">0.7309</text>
      <text x="1348" y="262">Sensitivity</text><text x="1548" y="262" text-anchor="end">0.7669</text>
      <text x="1348" y="296">Specificity</text><text x="1548" y="296" text-anchor="end">0.7230</text>
      <text x="1348" y="330">F1</text><text x="1548" y="330" text-anchor="end">0.5364</text>
    </g>
    <text x="1108" y="367" class="mono metric-muted">Paper · Table 2</text>
    <text x="1348" y="367" class="mono metric-muted">Run · C1_claim.json</text>

    <rect x="1092" y="410" width="78" height="28" rx="14" fill="url(#closePill)" stroke="#2b8a70"/>
    <circle cx="1111" cy="424" r="5" fill="#4fe0a0"/>
    <text x="1123" y="428" fill="#a8f5d5" font-size="11.5" font-weight="800">CLOSE</text>
    <text x="1184" y="428" fill="#9eb4ce" font-size="11.5">All metric deltas are within the ±0.010 tolerance.</text>

    <line x1="1092" y1="460" x2="1568" y2="460" class="divider"/>
    <text x="1092" y="490" class="eyebrow">NODE-LOCAL RISKS</text>
    <rect x="1092" y="506" width="476" height="70" rx="10" class="card"/>
    <circle cx="1117" cy="536" r="10" fill="#123f38" stroke="#2b8a70"/>
    <path d="M1112 536l3.5 3.5 7-8" fill="none" stroke="#62e4ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1138" y="532" fill="#dceafa" font-size="12.5" font-weight="650">No unresolved issue on the selected lineage</text>
    <text x="1138" y="552" class="subtle">Risk is retained at its origin node and traced downstream.</text>

    <line x1="1092" y1="600" x2="1568" y2="600" class="divider"/>
    <text x="1092" y="630" class="eyebrow">EVIDENCE LINEAGE</text>
    <text x="1092" y="654" fill="#dceafa" font-size="12.5">7 verified nodes · 6 evidence-bearing edges</text>
    <text x="1092" y="677" class="mono metric-muted">D2 → P1 → P2 → T1 → M1 → V1 → C1</text>
    <text x="1092" y="702" fill="#66dcff" font-size="11.5" font-weight="650">Open complete claim report →</text>
  </g>
</svg>
