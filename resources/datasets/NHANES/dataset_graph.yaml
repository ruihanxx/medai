  join_fields:
  - SEQN
  partition_guard: _cycle
  cardinality: file_specific_one_or_many_to_one
  applies_when: Both files belong to the same ordinary analytic release.
  evidence: Every locally profiled examination XPT contains SEQN.
  confidence: high

- relationship_id: laboratory_record_belongs_to_participant
