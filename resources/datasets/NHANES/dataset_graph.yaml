dataset_id: nhanes
generated_at: '2026-08-31'

partition_contract:
  physical_partition_keys:
  - cycle
  - component
  row_provenance_fields:
  - _cycle
  - _source_file
  repeated_graph_rule: >-
    This graph applies to all manifest files selected by schema properties. The
    adapter resolves physical files at runtime; entities and relationships are
    not duplicated for 1,598 XPT files.
  ordinary_cycle_join_guard: _cycle
  special_cycle_rule: >-
    Directories 1988-2020, 1999-2004, 1999-2023, and 2007-2012 contain reference
    or pooled releases. Their directory label is not an ordinary participant
    cycle and cannot be used as a demographics join guard without file-specific
    documentation.
  overlap_rule: >-
    The 2017-2020 combined pre-pandemic release includes 2017-2018 data. Never
    treat 2017-2018 and 2017-2020 as disjoint partitions.

schema_sets:
- schema_set_id: participant_linked
  selector: XPT schema contains SEQN
  observed_file_count: 1545
  resource_ids:
  - demographics
  - dietary
  - examination
  - laboratory
  - questionnaire
  key_semantics: >-
    SEQN links a row to a survey participant, but is not guaranteed to be a row
    key outside demographics. File-specific keys and cardinality come from the
    official codebook.
- schema_set_id: non_participant_or_pooled
  selector: XPT schema does not contain SEQN
  observed_file_count: 53
  resource_ids:
  - dietary
  - laboratory
  - questionnaire
  key_semantics: >-
    These files include lookup dictionaries and pooled-specimen tables. Resolve
    their file-specific keys from documentation; do not infer a participant
    relationship.

entities:
- entity_id: survey_participant_cycle
  description: One public-use participant record within one ordinary analytic release.
  resource_ids:
  - demographics
  key_fields:
  - _cycle
  - SEQN
  survey_design_fields:
  - cycle-appropriate sample weight
  - SDMVSTRA
  - SDMVPSU

- entity_id: dietary_record
  description: A participant-linked dietary total, recall item, supplement, or related response row from a file containing SEQN.
  resource_ids:
  - dietary
  key_fields:
  - _cycle
  - _source_file
  - SEQN
  - file-specific day/item/product fields

- entity_id: examination_record
  description: A participant-linked examination result or repeated instrument measurement.
  resource_ids:
  - examination
  key_fields:
  - _cycle
  - _source_file
  - SEQN
  - file-specific measurement fields

- entity_id: laboratory_record
  description: A participant-linked laboratory result from a file containing SEQN.
  resource_ids:
  - laboratory
  key_fields:
  - _cycle
  - _source_file
  - SEQN
  - file-specific analyte/specimen fields

- entity_id: questionnaire_record
  description: A participant-linked questionnaire response row from a file containing SEQN.
  resource_ids:
  - questionnaire
  key_fields:
  - _cycle
  - _source_file
  - SEQN
  - file-specific response fields

- entity_id: reference_or_pooled_record
  description: A lookup, food/supplement dictionary, or pooled-specimen row from a file without SEQN.
  resource_ids:
  - dietary
  - laboratory
  - questionnaire
  key_fields:
  - _source_file
  - file-specific documented key

relationships:
- relationship_id: dietary_record_belongs_to_participant
  from_entity: dietary_record
  to_entity: survey_participant_cycle
  join_fields:
  - SEQN
  partition_guard: _cycle
  cardinality: file_specific_one_or_many_to_one
  applies_when: Both files belong to the same ordinary analytic release and the dietary schema contains SEQN.
  evidence: NHANES component files use respondent sequence number SEQN for participant linkage.
  confidence: high

- relationship_id: examination_record_belongs_to_participant
  from_entity: examination_record
