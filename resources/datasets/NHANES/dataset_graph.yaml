survey_design:
  target_population: >-
    Cycle-specific nationally representative target populations are defined by
    NCHS documentation; do not generalize a release beyond its stated target.
  weights: >-
    Use the weight for the most restrictive component/subsample in the analytic
    cohort. Weight names and represented duration vary by release and file.
  variance: Use the cycle-appropriate masked strata and PSU variables and a survey-aware variance estimator.
  cross_cycle: Recalculate combined-cycle weights according to official guidance for the selected releases and component.
  pre_pandemic: Use the 2017-2020 supplied pre-pandemic weights; do not estimate the incomplete 2019-2020 portion separately.
  post_pandemic: Apply the dedicated 2021-2023 analytic guidance and account for its changed design and collection procedures.

temporal_structure:
  survey_cycle: Release/collection interval, not an event timestamp.
  participant_measurement_time: File-specific; many public files provide only cycle-level timing or masked/derived timing.
  dietary_day: Day 1 and Day 2 recalls are distinct repeated observations when both are present.
  repeated_measurement: Instrument and item-level files can contain multiple rows or columns per participant; use documented sequence/time fields.

alignment_notes:
- Resolve files through manifest.json and adapter.py; filenames and suffixes are not a sufficient schema contract.
- Call read_schema() before selecting variables, and use group_shared_schemas() to reuse an exact structure across files without repeating its columns.
- Join participant-linked files on SEQN plus the ordinary analytic cycle, then validate the expected merge cardinality for each source file.
- Keep _source_file after concatenation because identical variable names can have different eligibility, methods, limits of detection, units, or coding across releases.
- Select the analytic weight after the final cohort and component set are known; demographics weights are not universally valid for laboratory subsamples, fasting samples, or dietary analyses.
- Treat missing-by-design, below-detection-limit, refused, and unknown codes according to the file-specific codebook rather than as one generic missing category.
- Do not join files lacking SEQN to demographics unless an official, file-specific key relationship is documented.

unresolved_relationships:
- source: reference_or_pooled_record
  target: participant-linked entities
  issue: The 53 XPT files without SEQN use heterogeneous lookup or pooled-sample keys.
  suggested_resolution: Inspect the official file documentation and declare the exact lookup or pooled-analysis relationship for the selected file only.
  confidence: high
- source: special multi-cycle participant identifiers
  target: survey_participant_cycle
  issue: Special pooled directories do not identify one ordinary cycle through their path label.
  suggested_resolution: Use file documentation and explicit constituent-cycle evidence; do not infer cycle membership from the directory name.
  confidence: high
