temporal_structure:
  patient: may have multiple hospital admissions over time; dates are shifted per patient but internally consistent
    within patient
  emergency_department_stay: has an ED arrival/departure interval through intime and outtime; an admitted stay may
    link forward to one hospital admission through hadm_id
  emergency_department_event: medrecon, pyxis, and vitalsign have charttime; diagnosis and triage are stay-level
    records without a charttime field
  hospital_admission: has admission and discharge interval through admittime and dischtime
  hospital_transfer: tracks movement across hospital care locations and can include ICU stay_id
  icu_stay: occurs within a hospital admission and has intime/outtime interval
  event_tables: timestamped rows should be aligned by join keys and chart/store/start/end times according to task
    needs
alignment_notes:
- Use subject_id for patient-level linkage.
- The local ED component is the full MIMIC-IV-ED v2.2 release with 425087 stays across 205504 subjects.
- Use ED stay_id only within edstays, diagnosis, medrecon, pyxis, triage, and vitalsign. ED stay_id and ICU stay_id
  name different identifier domains and must not be joined directly.
- Link an admitted ED stay to the hospital module using populated edstays.hadm_id (and subject_id as a consistency
  guard); do not fabricate admission linkage for ED stays with null hadm_id.
- Preserve the separate MIMIC-IV-ED v2.2 component provenance in derived artifacts. The local MIMIC-IV v3.1 core
  tables do not resolve 39 ED subjects, 26 populated subject_id/hadm_id pairs, or 5 ED ICD code/version keys; treat
  those rows as explicitly unlinked rather than dropping or guessing a match.
- Use subject_id and hadm_id for admission-level linkage when hadm_id is present.
- Use subject_id, hadm_id, and stay_id for ICU stay/event linkage when stay_id is present.
- For hospital events lacking stay_id, align to ICU analyses only after admission linkage and temporal filtering
  against ICU intervals.
- Dates are deidentified and shifted consistently within a patient; do not compare absolute years across patients
  without anchor-year guidance.
