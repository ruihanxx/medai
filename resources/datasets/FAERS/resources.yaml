dataset_id: faers
dataset_name: FDA Adverse Event Reporting System Quarterly ASCII Extracts
version: 2014Q1-2024Q4
generated_at: '2026-08-25'
raw_root: raw
local_raw_root_note: >-
  The downloaded quarterly directories, original ZIP files, extracted FDA files,
  checksums, source URL list, and downloader are preserved beneath raw without
  modifying their contents.
official_sources:
- title: FDA AEMS latest quarterly data files
  url: https://www.fda.gov/drugs/fda-adverse-event-monitoring-system-aems/fda-adverse-event-monitoring-system-aems-latest-quarterly-data-files
  accessed: '2026-08-24'
  notes: FDA landing page; the system and page were formerly named FAERS.
- title: FDA FAERS/AEMS quarterly data extract file index
  url: https://fis.fda.gov/extensions/FPD-QDE-FAERS/FPD-QDE-FAERS.html
  accessed: '2026-08-24'
  notes: Official quarter-by-quarter ASCII and XML download index.
- title: Local FDA quarterly README and ASC_NTS documents
  path_spec:
  - raw/{quarter}/extracted/Readme.{doc|pdf}
  - raw/{quarter}/extracted/{ascii|ASCII}/ASC_NTS.{doc|pdf}
  notes: FDA-supplied format, caveat, field, and relationship documentation repeated in each quarterly package.

quarter_groups:
  all_quarters:
    selector: 2014Q1..2024Q4
    expected_count: 44
  legacy_2014_h1:
    quarters:
    - 2014Q1
    - 2014Q2
    expected_count: 2
  current_schema:
    selector: 2014Q3..2024Q4
    expected_count: 42
  deleted_case_quarters:
    selector: 2019Q1..2024Q4
    expected_count: 24

partition_contract:
  partition_key: quarter
  directory_pattern: raw/{YYYY}Q{Q}
  archive_pattern: raw/{quarter}/faers_ascii_{YYYY}{q|Q}{Q}.zip
  extracted_table_pattern: raw/{quarter}/extracted/{ascii|ASCII}/{TABLE}{YY}Q{Q}[_new].txt
  delimiter: '$'
  text_encoding: latin-1
  line_endings: mixed CRLF/LF across releases
  reuse_rule: >-
    Every logical resource below applies to a quarter group and is described once;
    adapter.py resolves the repeated physical files case-insensitively instead of
    storing a separate resource object for every year and quarter.
  observed_path_variants:
  - applies_to: 2014Q1..2019Q4
    ascii_directory: ascii
  - applies_to: 2020Q1..2024Q4
    ascii_directory: ASCII
  - applies_to: 2018Q1
    exception: The demographic filename is DEMO18Q1_new.txt.
  - applies_to: 2019Q1..2024Q4
    exception: Deleted-case directory and filenames vary in capitalization and naming; adapter.py discovers them by role.

schema_normalization:
  canonical_schema: current_schema
  rules:
  - resource_id: demographics
    applies_to: legacy_2014_h1
    rename:
      gndr_cod: sex
    fill_with_null:
    - auth_num
    - lit_ref
    - age_grp
  - resource_id: drugs
    applies_to: legacy_2014_h1
    fill_with_null:
    - prod_ai
  - resource_id: reactions
    applies_to: legacy_2014_h1
    fill_with_null:
    - drug_rec_act
  notes: >-
    Normalization changes only column shape. It does not infer values absent from
    the 2014Q1-Q2 extracts; adapter.py returns those cells as null.

clinical_caveats:
- A submitted report does not establish that a product caused an event.
- Spontaneous-report counts cannot estimate incidence or comparative drug risk.
- Quarter is extract/receipt provenance, not the adverse-event date; event and therapy dates may be partial YYYY, YYYYMM, or YYYYMMDD values.
- The extract is case/version based and supplies the latest completed version available when a quarterly extract is produced.
- Supporting frequency PDFs can differ slightly from physical file counts for older extracts; use physical files for local row counts.

