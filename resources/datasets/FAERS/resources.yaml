    expected_count: 49
  deleted_case_quarters:
    selector: 2019Q1..2024Q4
    expected_count: 24

partition_contract:
  partition_key: quarter
  directory_pattern: raw/{YYYY}Q{Q}
  archive_pattern: raw/{quarter}/{aers|faers}_ascii_{YYYY}{q|Q}{Q}.zip
  extracted_table_pattern: raw/{quarter}/extracted/{ascii|ASCII}/{TABLE}{YY}Q{Q}[_new].txt
  delimiter: '$'
  text_encoding: latin-1
  line_endings: mixed CRLF/LF across releases
  reuse_rule: >-
    Each logical resource and graph relationship is declared once against a
    reusable quarter group. adapter.py resolves the repeated physical files;
    individual years and quarters are not separate resource objects.
  observed_path_variants:
  - applies_to: legacy_aers
    archive_prefix: aers_ascii
    ascii_directory: ascii
  - applies_to: all_faers
    archive_prefix: faers_ascii
  - applies_to: 2012Q4..2019Q4
    ascii_directory: ascii
  - applies_to: 2020Q1..2024Q4
    ascii_directory: ASCII
  - applies_to: 2018Q1
    exception: The demographic filename is DEMO18Q1_new.txt.
  - applies_to: deleted_case_quarters
    exception: Deleted-case directory and filenames vary in capitalization and naming; adapter.py discovers them by role.
  - applies_to: legacy_aers
    exception: Data rows commonly contain one empty field after a trailing '$'; adapter.py accepts only empty trailing fields.

schema_normalization:
  canonical_schema: loss_preserving_union_2004_2024
  rules:
  - applies_to: legacy_aers
    common_rename:
      ISR: primaryid
    resource_specific_rename:
      demographics:
        CASE: caseid
        I_F_COD: i_f_code
        GNDR_COD: sex
      indications:
        DRUG_SEQ: indi_drug_seq
      therapies:
        DRUG_SEQ: dsg_drug_seq
    absent_fields: >-
      CASEVERSION is not inferred from FOLL_SEQ. CASEID is null in normalized
      legacy secondary tables because those files contain ISR only.
  - applies_to: faers_transition_q4
    cleanup:
    - Strip the UTF-8 BOM decoded through latin-1 from DRUG primaryid.
    - Strip surrounding header whitespace, including DEMO ' rept_dt'.
    rename:
      lot_nbr: lot_num
      outc_code: outc_cod
  - applies_to: faers_pre_2014q3
    rename:
      gndr_cod: sex
    fill_with_null:
    - demographics.auth_num
    - demographics.lit_ref
    - demographics.age_grp
    - drugs.prod_ai
    - reactions.drug_rec_act
  - applies_to: all_faers
    fill_with_null:
    - demographics.foll_seq
    - demographics.image
    - demographics.death_dt
    - demographics.confid
  notes: >-
    Normalization changes column names and shape only. Missing values are null;
    no legacy follow-up sequence, case version, date, or identifier is inferred.

clinical_caveats:
- A submitted spontaneous report does not establish that a product caused an event.
- Report counts cannot estimate incidence or comparative drug risk.
- Quarter is extract/receipt provenance, not the adverse-event date; dates may be partial YYYY, YYYYMM, or YYYYMMDD values.
- Legacy AERS ISR values may reappear in later quarters with updated data, and a CASE value may change; retain quarter when combining extracts.
- FAERS quarters are case/version based and can contain later CASEVERSION values for a CASEID; predeclare a cross-quarter version-selection rule.
- Supporting frequency documents can differ slightly from physical file counts; use physical files for local row counts.

