dataset_id: faers
dataset_name: FDA AERS/FAERS Quarterly ASCII Extracts (now AEMS)
version: 2004Q1-2024Q4
generated_at: '2026-08-25'
raw_root: raw
local_raw_root_note: >-
  The original FDA ZIPs, extracted files, completion markers, checksums, source
  URL list, and resumable range downloader are preserved beneath raw. Source
  table contents are not rewritten during schema normalization.

official_sources:
- title: FDA AEMS latest quarterly data files
  url: https://www.fda.gov/drugs/fda-adverse-event-monitoring-system-aems/fda-adverse-event-monitoring-system-aems-latest-quarterly-data-files
  accessed: '2026-08-25'
  notes: FDA landing page; the system was formerly named FAERS and AERS.
- title: FDA AERS/FAERS/AEMS quarterly data extract file index
  url: https://fis.fda.gov/extensions/FPD-QDE-FAERS/FPD-QDE-FAERS.html
  accessed: '2026-08-25'
  notes: Official quarter-by-quarter ASCII and XML download index.
- title: Local FDA quarterly README and ASCII notes
  path_spec:
  - raw/{quarter}/extracted/{README|Readme}.{doc|pdf}
  - raw/{quarter}/extracted/{ascii|ASCII}/{Asc_nts|ASC_NTS}.{doc|pdf}
  notes: FDA-supplied field definitions, joins, release changes, and caveats.

