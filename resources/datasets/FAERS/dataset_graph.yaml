partition_contract:
  partition_key: quarter
  selector: 2014Q1..2024Q4
  expected_partition_count: 44
  applies_to_resource_ids:
  - demographics
  - drugs
  - indications
  - outcomes
  - reactions
  - report_sources
  - therapies
  reuse_rule: >-
    The entity and relationship graph below applies identically within every
    selected quarter. Resolve the seven physical table files through adapter.py;
    do not duplicate this graph for individual years or quarters.
  cross_partition_rule: >-
    Retain _quarter as provenance when combining partitions. A later quarter may
    contain a later version of an existing CASEID, so cross-quarter cohorts must
    define a version-selection rule instead of treating every row as a new case.

schema_versions:
- schema_id: legacy_2014_h1
  applies_to:
