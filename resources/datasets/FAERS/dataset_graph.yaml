  evidence: FDA FAQ 44 states that deletion lists contain cases deleted by FDA or manufacturers; the files contain one unlabelled identifier per line.
  confidence: medium

temporal_structure:
  quarter: Extract partition covering reports received or completed for that quarter; it is not the adverse-event date.
  case_version: CASEVERSION increments for follow-ups, while PRIMARYID identifies a specific case version and CASEID groups versions.
  adverse_event_date: EVENT_DT can be partial YYYY, YYYYMM, or YYYYMMDD and must retain its submitted precision.
  therapy_interval: START_DT and END_DT can be partial; a drug may have multiple intervals with the same PRIMARYID and drug sequence.
  extract_semantics: The quarterly output supplies the latest completed version available when the extract is prepared; exceptional processing delays can move a case into a later extract.

semantic_value_changes:
- applies_to: 2021Q4..2024Q4
  field: reporter_country and occr_country
  change: FDA documentation says the modernized extracts use GENC country codes.
- applies_to: 2022Q3..2024Q4
  field: rept_cod
  change: 5DAY and 30DAY appear as combination-product report types.
- applies_to: 2024Q4
  field: role_cod
  change: DN (Drug Not Administered) was added as a valid role code.

alignment_notes:
- Join the seven core tables within a quarter using PRIMARYID; retain _quarter as an explicit guard and provenance field.
- Link THER and INDI to DRUG with both PRIMARYID and the table-specific drug sequence; a drug sequence is not globally unique.
- Use CASEID plus CASEVERSION for cross-quarter version reasoning. Do not assume one physical row per real-world case across all partitions.
- Preserve partial dates as strings or explicit interval/precision representations; do not impute missing month or day as 01.
- MedDRA preferred terms in REAC and INDI are release-dependent coded labels; term casing and MedDRA versions can change over time.
- Apply deleted-case notices when constructing longitudinal datasets. The 2019Q1 AllDeletedCases file is historical/cumulative and is excluded by the adapter unless explicitly requested.
- Do not infer causality, incidence, or comparative product risk from spontaneous-report counts.

unresolved_relationships:
- source: deleted_cases.caseid
  target: demographics.caseid
  issue: Deletion files have no header; the FDA FAQ calls their values cases but does not label the identifier field in the physical file.
  suggested_resolution: Treat values as CASEID for case-level exclusion, retain source filename and quarter, and verify against the task-specific case population before destructive filtering.
  confidence: medium
- source: cross-quarter case versions
  target: analysis cohort
  issue: A case may be represented by different versions in different extracts, and delayed processing can shift its appearance.
  suggested_resolution: Predeclare whether the analysis is quarter-of-receipt, report-version, or latest-case based, then select by CASEID, CASEVERSION, and FDA receipt dates accordingly.
  confidence: high
