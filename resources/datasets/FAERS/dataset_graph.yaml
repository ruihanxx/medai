dataset_id: faers
generated_at: '2026-08-25'

partition_contract:
  partition_key: quarter
  selector: 2004Q1..2024Q4
  expected_partition_count: 84
  applies_to_resource_ids:
  - demographics
  - drugs
  - indications
  - outcomes
  - reactions
  - report_sources
  - therapies
  reuse_rule: >-
    This entity/relationship graph applies within every selected quarter.
    Resolve physical files through adapter.py; do not duplicate the graph for
    individual years or quarters.
  cross_partition_rule: >-
    Retain _quarter as provenance and as a join guard. A legacy ISR may reappear
    with updated data, and a FAERS CASEID may appear with later CASEVERSION
    values, so no report row is globally unique by primaryid alone.

identifier_regimes:
- regime_id: legacy_aers
  applies_to: 2004Q1..2012Q3
  raw_report_key: ISR
  canonical_report_key: primaryid
  raw_case_key: CASE
  canonical_case_key: caseid
  followup_field: FOLL_SEQ
  semantics: >-
    ISR is the primary link between all seven files within a quarter. CASE
    groups AERS reports, but an ISR can recur in a later extract with updated
    data and its associated CASE can change. FOLL_SEQ is manufacturer-provided
    and is not a case-version counter.
- regime_id: faers
  applies_to: 2012Q4..2024Q4
  raw_report_key: PRIMARYID
  canonical_report_key: primaryid
  raw_case_key: CASEID
  canonical_case_key: caseid
  version_field: CASEVERSION
  semantics: >-
    PRIMARYID identifies a released FAERS case version; CASEID groups versions
    and CASEVERSION represents version order. The 2012Q4 header anomalies do
    not change these key semantics.

schema_versions:
- schema_id: aers_without_reporter_country
  applies_to: 2004Q1..2005Q2
  differences:
  - Seven tables use uppercase AERS headers and ISR as their shared key.
  - DEMO ends at CONFID and has no REPORTER_COUNTRY.
  normalization: ISR/CASE and resource-specific drug-sequence aliases map into the canonical union; absent fields remain null.
- schema_id: aers_with_reporter_country
  applies_to: 2005Q3..2012Q3
  differences:
  - DEMO adds REPORTER_COUNTRY; the other six core headers are unchanged.
  normalization: Same AERS identifier mapping as the preceding range.
- schema_id: faers_transition_q4
  applies_to:
  - 2012Q4
  differences:
  - DEMO contains a leading space in the raw ' rept_dt' header.
  - DRUG primaryid begins with a UTF-8 BOM decoded via latin-1 and uses LOT_NBR.
  - OUTC uses OUTC_CODE rather than OUTC_COD.
  normalization: Strip the BOM/whitespace and map LOT_NBR and OUTC_CODE to canonical names.
- schema_id: faers_initial
  applies_to: 2013Q1..2014Q2
  differences:
  - DEMO uses GNDR_COD and lacks AUTH_NUM, LIT_REF, and AGE_GRP.
  - DRUG lacks PROD_AI; REAC lacks DRUG_REC_ACT.
  normalization: Rename GNDR_COD to SEX and fill absent canonical fields with null.
- schema_id: current
  applies_to: 2014Q3..2024Q4
  differences: []
  normalization: Current physical headers match the modern subset of the canonical union; legacy-only DEMO fields are null.

