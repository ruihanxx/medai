temporal_structure:
  quarter: Extract partition and receipt/release provenance; it is not the adverse-event date.
  legacy_aers_report: >-
    ISR identifies a report inside a partition. FDA legacy notes say a repeated
    ISR in a later quarter is an updated record and may acquire a replacement
    CASE value; analyses must predeclare whether later extracts replace earlier
    ISR rows.
  legacy_aers_case: >-
    CASE groups reports. FOLL_SEQ is verbatim manufacturer follow-up data and
    must not be translated into CASEVERSION. Legacy FDA notes suggest selecting
    latest FDA_DT, then higher ISR on ties, when a task explicitly requires one
    representative ISR per CASE.
  faers_case_version: CASEVERSION orders follow-ups within CASEID; PRIMARYID identifies a released case version.
  adverse_event_date: EVENT_DT can be partial YYYY, YYYYMM, or YYYYMMDD and must retain submitted precision.
  therapy_interval: START_DT and END_DT can be partial; one drug can have multiple intervals under the same report key and drug sequence.

semantic_value_changes:
- applies_to: 2021Q4..2024Q4
  field: reporter_country and occr_country
  change: FDA documentation says the modernized extracts use GENC country codes.
- applies_to: 2022Q3..2024Q4
  field: rept_cod
  change: 5DAY and 30DAY appear as combination-product report types.
- applies_to: 2024Q4
  field: role_cod
  change: DN (Drug Not Administered) was added as a valid role code.

alignment_notes:
- Join all seven core tables within a quarter using canonical PRIMARYID plus _quarter; this maps to raw ISR in AERS and raw PRIMARYID in FAERS.
- Link THER and INDI to DRUG with both the report key and drug sequence; a drug sequence is not globally unique.
- Legacy secondary tables contain no CASE field, so their normalized caseid is null; join to DEMO on _quarter and primaryid when case-level fields are needed.
- Do not compare or merge AERS FOLL_SEQ with FAERS CASEVERSION, and do not join across the 2012Q3/2012Q4 system boundary using primaryid alone.
- Preserve partial dates as strings or explicit precision-aware intervals; do not impute missing month/day as 01.
- MedDRA preferred-term labels and dictionary versions can change across releases.
- Apply deletion notices when constructing longitudinal FAERS cohorts; the 2019Q1 AllDeletedCases file is cumulative and opt-in in the adapter.
- Do not infer causality, incidence, or comparative product risk from spontaneous-report counts.

unresolved_relationships:
- source: deleted_cases.caseid
  target: demographics.caseid
  issue: Physical deletion files have no header, and the supplied documentation describes values as cases without labelling the field in-file.
  suggested_resolution: Treat values as case-level exclusion identifiers, retain source filename/quarter, and verify against the task-specific cohort before filtering.
  confidence: medium
- source: cross-quarter report/case lineage
  target: analysis cohort
  issue: Legacy ISR rows can be updated and CASE values can change; FAERS CASEIDs can have multiple CASEVERSION values across extracts.
  suggested_resolution: Predeclare regime-specific replacement/version rules and retain raw identifiers plus quarter before deduplication.
  confidence: high
