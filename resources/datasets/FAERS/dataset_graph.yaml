  - 2014Q2
  differences:
  - DEMO uses GNDR_COD instead of SEX and lacks AUTH_NUM, LIT_REF, and AGE_GRP.
  - DRUG lacks PROD_AI.
  - REAC lacks DRUG_REC_ACT.
  normalization: adapter.py renames GNDR_COD to SEX and fills absent canonical fields with null.
- schema_id: current_schema
  applies_to: 2014Q3..2024Q4
  differences: []
  normalization: Physical headers already match the canonical resource schemas.

