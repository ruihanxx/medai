[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medai"
version = "0.1.0"
description = "Evidence-bound medical paper replication orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Jinja2>=3.1,<4",
    "langgraph>=1,<2",
    "psutil>=6,<8",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
pdf = [
    "accelerate>=1.5.1,<2",
    "mineru[pipeline]>=3,<4",
    "six>=1.16,<2",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
medai-internal = "medai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/medai"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "medai/templates"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
